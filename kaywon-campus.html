<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>계원 캠퍼스, 잠깐 쉬어가요</title>
<style>
:root{--bg:#22355a;--glass:rgba(24,30,46,.5);--line:rgba(255,255,255,.28);--tx:#fff6e8;--accent:#ffd27a;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22355a}}
:root[data-theme="dark"]{--bg:#22355a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.pill{position:fixed;display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--glass);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;font-weight:600}
#tools{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;padding:4px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#tools button{width:36px;height:36px;border-radius:50%;font-size:17px}
#tools button:hover,#bar button:hover{background:rgba(255,255,255,.14)}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);font-size:13px;opacity:.85;transition:opacity 1.2s;pointer-events:none;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.5)}
#bar{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);padding:6px;gap:2px}
#bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:18px;font-size:12px}
#bar button span{font-size:20px;line-height:1}
.tag{position:fixed;left:0;top:0;pointer-events:none;will-change:transform;display:flex;flex-direction:column;align-items:center;gap:4px}
.tag b{display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;padding:3px 10px 3px 4px;border-radius:999px;background:rgba(255,246,232,.92);color:#2a2f3a}
.tag b i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#6f7d5c;color:#fff;font-size:10px;display:grid;place-items:center}
.tag b.n{padding-left:10px}
.tag em{font-style:normal;font-size:20px;opacity:0;transform:translateY(6px);transition:.25s}
.tag em.on{opacity:1;transform:none}
.tag em.t{font-size:12px;background:rgba(255,246,232,.95);color:#2a2f3a;padding:4px 10px;border-radius:12px;white-space:nowrap}
.place{position:fixed;left:0;top:0;pointer-events:none;font-size:13px;letter-spacing:.04em;padding:3px 10px;border-radius:6px;background:rgba(26,32,48,.62);border:1px solid var(--line)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#chat{bottom:calc(env(safe-area-inset-bottom,0px) + 100px);left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));padding:5px 5px 5px 16px}
#chat.cast{border-color:var(--accent);box-shadow:0 0 14px rgba(255,210,122,.45)}
#chat input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
#chat input::placeholder{color:rgba(255,246,232,.6)}
#chat button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16)}
#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 152px);transform:translateX(-50%);max-width:calc(100vw - 24px);text-align:center;font-size:13px;padding:6px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .3s;pointer-events:none}
#msg.on{opacity:1}
#chat button.rec{background:#e5484d;animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}
</style>
</head>
<body>
<div id="top" class="pill">🎨 계원 캠퍼스 01</div>
<div id="tools" class="pill"><button id="snd" title="소리">🔊</button><button id="dice" title="닉네임 바꾸기">🎲</button></div>
<div id="hint">바닥 클릭 또는 WASD·방향키로 이동 · 스페이스 점프 · 드래그로 둘러보기 · 휠/핀치로 확대</div>
<div id="bar" class="pill">
<button data-a="sketch"><span>✏️</span>스케치</button>
<button data-a="photo"><span>📷</span>촬영</button>
<button data-a="clap"><span>👏</span>박수</button>
<button data-a="rest"><span>☕</span>쉬기</button>
<button data-a="wand"><span>🪄</span>지팡이</button>
</div>
<div id="flash"></div>
<div id="msg"></div>
<div id="chat" class="pill"><input id="chatin" type="text" maxlength="60" placeholder="채팅 입력 (Enter)" autocomplete="off"><button id="mic" title="음성 입력">🎤</button><button id="chatgo" title="보내기">➤</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const HORIZON=0xd9a083;

const R=new THREE.WebGLRenderer({antialias:true});

(function(){const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#1d2d52');gr.addColorStop(.55,'#7a6a8e');gr.addColorStop(1,'#d9a083');g.fillStyle=gr;g.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c)})();
scene.fog=new THREE.Fog(HORIZON,22,75);
const cam=new THREE.PerspectiveCamera(55,1,.1,200);

const sun=new THREE.DirectionalLight(0xffb27a,.7);sun.position.set(-30,22,18);scene.add(sun);

const plaza=new THREE.Mesh(new THREE.CircleGeometry(10,40),M(0xd8cbb2));plaza.rotation.x=-Math.PI/2;plaza.position.y=.02;scene.add(plaza);

function facade(base,rep){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,128,128);for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle=Math.random()<.65?'#ffd98a':'#33435e';g.fillRect(x*32+7,y*32+8,18,16)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);return t}
function building(x,z,w,h,d,base,name){

const roof=new THREE.MeshLambertMaterial({color:0x3a3f47});

}
const places=[];
building(0,-26,30,14,10,'#b9a58f','본관');
building(-27,-6,10,11,22,'#9aa7a8','디자인관');
building(27,-4,10,9,20,'#c7a08a','갤러리');
const inside=(x,z)=>rects.some(r=>x>r[0]&&x<r[1]&&z>r[2]&&z<r[3]);
// trees
function tree(x,z,col){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,2,6),M(0x5a4332));t.position.y=1;g.add(t);
const s=rnd(1.4,2.2);[[0,2.6,0,1],[0,3.8,0,.72]].forEach(a=>{const c=new THREE.Mesh(new THREE.IcosahedronGeometry(s*a[3],0),M(col,true));c.position.y=a[1];c.rotation.y=rnd(0,3);g.add(c)});
g.position.set(x,0,z);scene.add(g);cols.push([x,z,.35])}
for(let i=0,n=0;n<44&&i<400;i++){const a=rnd(0,6.283),r=rnd(14,46),x=Math.cos(a)*r,z=Math.sin(a)*r;if(inside(x,z)||(Math.abs(x)<3&&z>0&&z<26)||(Math.abs(z+3)<3&&Math.abs(x)<22))continue;tree(x,z,pick([0xf2c230,0xf2c230,0xe8a020,0xc0502b]));n++}
// sculpture
const ped=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.5,1.2,12),M(0xe9e2d4));ped.position.y=.6;scene.add(ped);cols.push([0,0,1.6]);
const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.2,.36,90,12),M(0xf6efe3,true));knot.position.y=3.2;scene.add(knot);
const warm=new THREE.PointLight(0xffc27a,1.1,16);warm.position.set(0,4,2);scene.add(warm);
// lamps
for(let i=0;i<8;i++){const a=i/8*6.283+.4,x=Math.cos(a)*11.5,z=Math.sin(a)*11.5;
const p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,3,6),M(0x2b2b2e));p.position.set(x,1.5,z);scene.add(p);cols.push([x,z,.15]);
const l=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),new THREE.MeshBasicMaterial({color:0xffe2a8}));l.position.set(x,3.1,z);scene.add(l);
if(i%3==0){const pl=new THREE.PointLight(0xffc27a,.7,13);pl.position.set(x,3.1,z);scene.add(pl)}}
// people
const people=[];
const ADJ=['느긋한','반짝이는','수줍은','졸린','따뜻한','엉뚱한','고요한'],NOUN=['붓','스케치북','물감','연필','캔버스','가위','팔레트'];
const nick=()=>pick(ADJ)+' '+pick(NOUN);
function person(color,hat,name,me){
const g=new THREE.Group(),b=new THREE.Group();g.add(b);
const add=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,M(c));m.position.set(x,y,z);b.add(m);return m};
add(new THREE.CylinderGeometry(.34,.5,.95,10),color,0,.62,0);
add(new THREE.SphereGeometry(.4,14,12),0xf0c9a0,0,1.5,0);
add(new THREE.CylinderGeometry(.52,.42,.15,14),hat,.06,1.88,0);
add(new THREE.SphereGeometry(.05,6,6),0x222222,-.14,1.52,.36);
add(new THREE.SphereGeometry(.05,6,6),0x222222,.14,1.52,.36);
scene.add(g);
const el=document.createElement('div');el.className='tag';
el.innerHTML='<em></em><b class="'+(me?'':'n')+'">'+(me?'<i>나</i>':'')+'<span></span></b>';
document.body.appendChild(el);
const p={g,b,el,bub:el.querySelector('em'),nm:el.querySelector('span'),target:null,act:null,wait:rnd(1,5),me};
p.nm.textContent=name;let sx,sz;do{sx=me?0:rnd(-8,8);sz=me?9:rnd(-4,12)}while(!me&&(Math.hypot(sx,sz)<3.5||people.some(o=>Math.hypot(sx-o.g.position.x,sz-o.g.position.z)<1.5)));g.position.set(sx,0,sz);people.push(p);return p}
const me=person(0xe9715b,0x2e4a6b,nick(),true);
const wand=new THREE.Group();wand.position.set(-.5,.85,.25);wand.rotation.x=1.1;me.b.add(wand);me.wand=wand;
const hand=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),M(0xf0c9a0));hand.position.set(-.5,.85,.25);me.b.add(hand);
const stick=new THREE.Mesh(new THREE.CylinderGeometry(.025,.045,.95,6),M(0x4a2f1c));stick.position.y=.35;wand.add(stick);
const tip=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshBasicMaterial({color:0xfff0b0}));tip.position.y=.85;wand.add(tip);me.tip=tip;
const COLS=[0x6fa8a0,0xe0b04a,0x8f86c8,0xcf8aa0,0x7aa86a,0x5f8fc7];
for(let i=0;i<6;i++)person(pick(COLS),pick(COLS),nick(),false);
// audio
let AC,mute=false;
function tone(f,d,ty,v,s){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+(s||0);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.12));o.start(t);o.stop(t+(d||.12)+.02)}catch(e){}}
const ACTS={sketch:{e:'✏️',s:()=>{tone(660,.1);tone(784,.14,'sine',.06,.1)}},photo:{e:'📷',s:()=>{tone(1200,.04,'square',.04);tone(800,.08,'square',.04,.06)}},clap:{e:'👏',s:()=>{tone(220,.05,'square',.05);tone(220,.05,'square',.05,.16);tone(220,.05,'square',.05,.32)}},rest:{e:'☕',s:()=>{tone(440,.5,'sine',.05);tone(330,.7,'sine',.05,.2)}}};
function act(p,k,t){p.act={k,t0:t||performance.now()/1000};p.target=null;bubble(p,ACTS[k].e,false,2400);
if(p.me){ACTS[k].s();if(k==='photo'){const f=document.getElementById('flash');f.style.opacity=.85;setTimeout(()=>f.style.opacity=0,90)}}}
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>b.dataset.a==='wand'?toggleWand():act(me,b.dataset.a));
document.getElementById('snd').onclick=e=>{mute=!mute;e.currentTarget.textContent=mute?'🔇':'🔊'};
document.getElementById('dice').onclick=()=>{me.nm.textContent=nick();tone(520,.08)};
setTimeout(()=>document.getElementById('hint').style.opacity=0,9000);
// camera + input
let yaw=0,pitch=.5,dist=13;
const ptrs=new Map();let drag=0,pd=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);drag=0;if(ptrs.size==2)pd=pdist()});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
if(ptrs.size==2){const d=pdist();dist=clamp(dist-(d-pd)*.03,5,28);pd=d;drag=99}
else{drag+=Math.abs(dx)+Math.abs(dy);if(drag>6){yaw-=dx*.006;pitch=clamp(pitch+dy*.004,.15,1.3)}}});
cv.addEventListener('pointerup',e=>{if(ptrs.size==1&&drag<=6)click(e);ptrs.delete(e.pointerId)});
cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
cv.addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.012,5,28)},{passive:true});
const ray=new THREE.Raycaster(),mk=new THREE.Mesh(new THREE.RingGeometry(.35,.5,24),new THREE.MeshBasicMaterial({color:0xffe2a8,transparent:true,opacity:0}));mk.rotation.x=-Math.PI/2;scene.add(mk);let mkT=0;
function click(e){const v=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v,cam);
if(holding){const hp=ray.intersectObjects(people.map(p=>p.g),true)[0];if(hp){let o=hp.object;while(o&&!people.some(p=>p.g===o))o=o.parent;const tg=people.find(p=>p.g===o);if(tg){select(tg);return}}}
const h=ray.intersectObject(ground)[0];if(!h)return;select(null);if(lockd(me))return;
const p=h.point;if(inside(p.x,p.z))return;const r=Math.hypot(p.x,p.z);if(r>45)p.multiplyScalar(45/r);
me.target=p.clone();me.target.y=0;me.act=null;mk.position.set(p.x,.06,p.z);mkT=1;tone(600,.05,'sine',.03)}
// labels
// collision
function bubble(p,s,txt,ms){p.bub.textContent=s;p.bub.classList.toggle('t',!!txt);p.bub.classList.add('on');clearTimeout(p.bt);p.bt=setTimeout(()=>p.bub.classList.remove('on'),ms)}
function hit(x,z,p){if(inside(x,z))return 'w';
for(const c of cols)if(Math.hypot(x-c[0],z-c[1])<c[2]+.4)return 'w';
const q=p.g.position;for(const o of people){if(o===p||o.g.position.y>1.5)continue;const d=Math.hypot(x-o.g.position.x,z-o.g.position.z);if(d<(o.bow!=null||o.back>0?1.8:.9)&&d<Math.hypot(q.x-o.g.position.x,q.z-o.g.position.z))return o}return null}
function step(p,nx,nz){const q=p.g.position,b=hit(nx,nz,p);if(!b){q.x=nx;q.z=nz;return null}
if(!hit(nx,q.z,p))q.x=nx;else if(!hit(q.x,nz,p))q.z=nz;return b}
function sorry(o,t){if(o.an||lockd(o)||t-(o.sorryT||-9)<3)return;o.sorryT=t;o.target=null;o.act=null;o.wait=3.5;o.back=1.2;o.g.rotation.y=Math.atan2(me.g.position.x-o.g.position.x,me.g.position.z-o.g.position.z);bubble(o,'죄송합니다',true,2200)}
// magic
const chat=document.getElementById('chatin'),chatBox=document.getElementById('chat'),msg=document.getElementById('msg');
let mt,sel=null,holding=true;
function toast(s,ms){msg.textContent=s;msg.classList.add('on');clearTimeout(mt);mt=setTimeout(()=>msg.classList.remove('on'),ms||2600)}
const SP=[['fin',/피니테|finite|원래|해제|풀어/],['lev',/윙가르디움|레비오사|wingardium|leviosa|띄워|levitat|하늘|둥실/],['par',/페트리피쿠스|토탈루스|petrificus|totalus|마비|얼어|경직|굳어|paraly/],['pig',/돼지|꿀꿀|pig/],['mouse',/쥐|mouse|rat|찍찍/],['snake',/뱀|서펜소르티아|serpensortia|snake|쉬이/]];
const SPW={lev:['윙가르디움레비오사','윙가르디움','레비오사','띄워','하늘로','wingardiumleviosa'],par:['페트리피쿠스토탈루스','페트리피쿠스','토탈루스','마비','얼어붙어','경직','굳어','petrificustotalus'],pig:['돼지','꿀꿀','pig'],mouse:['쥐','생쥐','찍찍','mouse','rat'],snake:['뱀','서펜소르티아','쉬이','snake'],fin:['피니테인칸타템','피니테','원래대로','해제','풀어','finiteincantatem']};
const CH=['ㄱ','ㄱ','ㄴ','ㄷ','ㄷ','ㄹ','ㅁ','ㅂ','ㅂ','ㅅ','ㅅ','','ㅈ','ㅈ','ㅈ','ㄱ','ㄷ','ㅂ','ㅎ'];
const VW=['ㅏ','ㅔ','ㅑ','ㅖ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅞ','ㅞ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
function jamo(s){let o='';for(const c of s.toLowerCase().replace(/[^0-9a-z\uac00-\ud7a3]/g,'')){const n=c.charCodeAt(0)-0xac00;if(n>=0&&n<=11171)o+=CH[Math.floor(n/588)]+VW[Math.floor(n%588/28)];else o+=c}return o}
function asub(p,t){let pv=new Array(t.length+1).fill(0);for(let i=1;i<=p.length;i++){const cu=[i];for(let j=1;j<=t.length;j++)cu[j]=Math.min(pv[j]+1,cu[j-1]+1,pv[j-1]+(p[i-1]===t[j-1]?0:1));pv=cu}return Math.min.apply(null,pv)}
function spell(s,loose){const q=s.toLowerCase().replace(/\s+/g,'');for(const a of SP)if(a[1].test(q))return a[0];
if(!loose)return null;const t=jamo(s);if(!t)return null;let best=null,bs=9;

const snakes=[];
for(let i=0;i<3;i++){const g=mkAnimal('snake');g.scale.setScalar(1.1);const a=rnd(0,6.283),r=rnd(4,8);g.position.set(Math.cos(a)*r,.02,Math.sin(a)*r);scene.add(g);snakes.push({g,tg:null,wait:rnd(0,3),ph:rnd(0,6)})}

// keyboard
const keys={};me.jy=0;me.vy=0;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.code;if(k==='Enter'){e.preventDefault();chat.focus();return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();keys[k]=true;if(k==='Space'&&!e.repeat&&me.jy===0&&!lockd(me)){me.vy=6.5;tone(520,.09,'sine',.05)}});
addEventListener('keyup',e=>{if(e.code==='Space')e.preventDefault();keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('button').forEach(b=>b.addEventListener('mouseup',()=>b.blur()));

addEventListener('resize',resize);resize();
let last=performance.now()/1000;
function frame(){requestAnimationFrame(frame);const t=performance.now()/1000,dt=Math.min(t-last,.05);last=t;
people.forEach(p=>{
if(p.fx){const e=t-p.fx.t0;if(p.fx.end==null&&e>p.fx.dur)endFx(p,t);else if(p.fx.end!=null&&t-p.fx.end>.8)clearFx(p)}
if(!p.me&&!p.target&&!p.act&&!lockd(p)){p.wait-=dt;if(p.wait<0){p.wait=rnd(2,7);if(Math.random()<.3)act(p,pick(Object.keys(ACTS)),t);else{for(let k=0;k<20;k++){const a=rnd(0,6.283),r=rnd(3,30),x=Math.cos(a)*r,z=Math.sin(a)*r;if(!inside(x,z)){p.target=new THREE.Vector3(x,0,z);break}}}}}
let moving=false;
if(p.back>0){const bx=p.g.position.x-me.g.position.x,bz=p.g.position.z-me.g.position.z,bl=Math.hypot(bx,bz)||1,s=Math.min(p.back,2.5*dt);const bk=step(p,p.g.position.x+bx/bl*s,p.g.position.z+bz/bl*s);p.back-=s;moving=true;if(bk)p.back=0;if(p.back<=0){p.back=0;p.bow=t}}
if(p.me){const rt=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
if((rt||fw)&&!lockd(p)){let dx=-Math.sin(yaw)*fw+Math.cos(yaw)*rt,dz=-Math.cos(yaw)*fw-Math.sin(yaw)*rt;const L=Math.hypot(dx,dz);dx/=L;dz/=L;
const q=p.g.position,sp=5*dt;let nx=q.x+dx*sp,nz=q.z+dz*sp;const r=Math.hypot(nx,nz);if(r>45){nx*=45/r;nz*=45/r}
const bk=step(p,nx,nz);if(bk&&bk!=='w')sorry(bk,t);
let da=Math.atan2(dx,dz)-p.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));p.g.rotation.y+=da*Math.min(1,dt*10);
p.target=null;p.act=null;moving=true}}
if(p.target){const d=p.target.clone().sub(p.g.position);const L=d.length();if(L>.15){moving=true;d.normalize();{const s=Math.min(L,(p.me?5:2.2)*dt),bk=step(p,p.g.position.x+d.x*s,p.g.position.z+d.z*s);if(bk){if(bk!=='w'&&p.me)sorry(bk,t);p.target=null}}let da=Math.atan2(d.x,d.z)-p.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));p.g.rotation.y+=da*Math.min(1,dt*10)}else p.target=null}
let y=0,rz=0,sy=1;
if(p.me&&(p.vy||p.jy>0)){p.vy-=18*dt;p.jy+=p.vy*dt;if(p.jy<=0){p.jy=0;p.vy=0}}
if(moving)y=Math.abs(Math.sin(t*10))*.12;
if(p.act){const e=t-p.act.t0;if(e>1.8)p.act=null;else{const k=p.act.k;if(k==='clap')y=Math.abs(Math.sin(e*9))*.35;else if(k==='photo')y=Math.max(0,Math.sin(e*7))*.3*(e<.9);else if(k==='sketch')rz=Math.sin(e*14)*.14;else sy=1-.18*Math.sin(Math.min(e,.5)/.5*1.57)}}
let lift=0,fall=0,shake=0;
if(p.fx){const f=p.fx,e=t-f.t0;let env=Math.min(1,e/(f.k==='par'?.55:1.4));if(f.end!=null)env=Math.min(env,1-(t-f.end)/.8);env=clamp(env,0,1);
if(f.k==='lev'){lift=env*3.4+Math.sin(t*2)*.2*env;p.spinA=(p.spinA||0)+dt*1.4*env;if(f.end!=null)p.spinA+=(Math.round(p.spinA/6.283)*6.283-p.spinA)*Math.min(1,dt*5);rz+=Math.sin(t*1.8)*.25*env}
else if(f.k==='par'){fall=env;if(e<.5)shake=Math.sin(e*60)*.07*(e/.5)}}else if(p.spinA)p.spinA=0;
p.g.position.y=lift;
const ty=p.an?p.an.userData.ty:(fall>.5?1.3:2.4);
if(p.wand){const fe=t-(p.flick||-9);p.wand.rotation.x=1.1-(fe<.4?Math.sin(fe/.4*Math.PI):0)}
if(p.an){p.an.position.y=y+(p.jy||0);const sg=p.an.userData.segs;if(sg)sg.forEach((s,i)=>{s.position.x=Math.sin(t*(moving?7:2)-i*.7)*(moving?.17:.07)*(i/4)})}
p.b.position.y=y+(p.jy||0)+fall*.42;p.b.rotation.z=rz;let bw=0;if(p.bow!=null){const e=t-p.bow;if(e>1.6)p.bow=null;else bw=Math.sin(e/1.6*Math.PI)*.7}p.b.rotation.x=bw-fall*1.45;p.b.rotation.y=p.spinA||0;p.b.position.x=shake;p.b.scale.y=sy;
put(p.el,p.g.position,ty)});
places.forEach(o=>put(o.el,o.pos,0));
knot.rotation.y=t*.4;knot.rotation.x=t*.2;
snakes.forEach(o=>{const g=o.g,q=g.position;let mv=false;
if(!o.tg){o.wait-=dt;if(o.wait<0){o.tg=snakeTarget(q);o.wait=rnd(1,4)}}
else{const dx=o.tg.x-q.x,dz=o.tg.z-q.z,L=Math.hypot(dx,dz);if(L<.2)o.tg=null;else{mv=true;const sp=Math.min(L,1.5*dt);q.x+=dx/L*sp;q.z+=dz/L*sp;let da=Math.atan2(dx,dz)-g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));g.rotation.y+=da*Math.min(1,dt*4)}}
g.userData.segs.forEach((m,i)=>{m.position.x=Math.sin(t*(mv?6:1.5)-i*.7+o.ph)*(mv?.17:.05)*(i/4)})});
if(sel){ring.position.set(sel.g.position.x,.08,sel.g.position.z);ring.scale.setScalar(1+Math.sin(t*5)*.06)}
for(let i=bolts.length-1;i>=0;i--){const o=bolts[i],k=Math.min(1,(t-o.t0)/.3);o.m.position.lerpVectors(o.a,o.b,k);if(k>=1){scene.remove(o.m);bolts.splice(i,1);o.cb()}}
for(let i=parts.length-1;i>=0;i--){const o=parts[i];o.l-=dt;o.m.position.addScaledVector(o.v,dt);o.v.multiplyScalar(1-dt*2);o.m.material.opacity=Math.max(0,o.l/.9);if(o.l<=0){scene.remove(o.m);parts.splice(i,1)}}
if(mkT>0){mkT=Math.max(0,mkT-dt*1.6);mk.material.opacity=mkT;mk.scale.setScalar(1+(1-mkT)*.8)}
const tp=me.g.position;cam.position.set(tp.x+Math.sin(yaw)*Math.cos(pitch)*dist,tp.y+1.4+Math.sin(pitch)*dist,tp.z+Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(tp.x,tp.y+1.4,tp.z);
R.render(scene,cam)}
frame();
})();
